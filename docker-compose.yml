services:
  mongodb:
    image: mongo:7
    container_name: social-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongo-express:
    image: mongo-express:latest
    container_name: social-mongo-express
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      - ME_CONFIG_MONGODB_SERVER=mongodb
      - ME_CONFIG_MONGODB_PORT=27017
      - ME_CONFIG_BASICAUTH_USERNAME=dilaw
      - ME_CONFIG_BASICAUTH_PASSWORD=IYUIAZEgsddjkfhisd75sq@!
    depends_on:
      mongodb:
        condition: service_healthy

  neo4j:
    image: neo4j:5-community
    container_name: social-neo4j
    restart: unless-stopped
    ports:
      - "7474:7474" # <-- This is your Neo4j Browser UI port!
      - "7687:7687"
    environment:
      NEO4J_AUTH: dilaw/IYUIAZEgsddjkfhisd75sq@!
      NEO4J_PLUGINS: '["apoc"]'
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u dilaw -p IYUIAZEgsddjkfhisd75sq@! 'RETURN 1' || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

  redis:
    image: redis:7-alpine
    container_name: social-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 🚀 ADDED: Redis Official Graphical Interface
  redis-insight:
    image: redis/redisinsight:latest
    container_name: social-redis-insight
    restart: unless-stopped
    ports:
      - "5540:5540"
    volumes:
      - redis_insight_data:/db
    depends_on:
      redis:
        condition: service_healthy

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: social-backend
    restart: unless-stopped
    ports:
      - "3456:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      MONGODB_URI: mongodb://mongodb:27017/socialmedia
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: dilaw
      NEO4J_PASSWORD: IYUIAZEgsddjkfhisd75sq@!
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: social-media-nosql-jwt-secret-change-in-prod
      JWT_EXPIRES_IN: 7d
      MAX_UPLOAD_SIZE_MB: "1024"
      CORS_ORIGIN: http://localhost:4200
    depends_on:
      mongodb:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: social-frontend
    restart: unless-stopped
    ports:
      - "4567:80"
    depends_on:
      - backend

volumes:
  mongodb_data:
  neo4j_data:
  redis_data:
  redis_insight_data: